[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "score2abc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pdf2image>=1.16",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["score2abc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
